# Build config for Velixir (built with Nixpacks). Without this file Velixir
# picks a .NET setup and `mix` is missing from the image.
providers = ["elixir"]

[variables]
MIX_ENV = "prod"

[phases.setup]
# gcc/make for bcrypt_elixir's NIF, git for the heroicons dependency.
nixPkgs = ["elixir_1_17", "gcc", "gnumake", "git"]

[phases.install]
cmds = [
  "mix local.hex --force",
  "mix local.rebar --force",
  "mix deps.get --only prod"
]

[phases.build]
# Overrides the default, which also runs `mix ecto.setup` (create DB + seeds)
# on every build.
cmds = ["mix compile", "mix assets.deploy"]

[start]
cmd = "mix ecto.migrate && mix phx.server"
